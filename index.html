<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Cap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mon Cap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#16181d;--mut:#6b7280;--line:#e6e8ec;--soft:#eef0f4;--acc:#3b5bdb;--onacc:#fff;--red:#d6336c;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#eceef2;--mut:#9097a3;--line:#262a32;--soft:#222630;--acc:#8ea2ff;--onacc:#0f1115;--red:#ff8fb1;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/22px Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:active{opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.body:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.in-w{max-width:560px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
#sub{color:var(--mut);font-size:13px;text-transform:capitalize}
h1{font-size:28px;line-height:34px;font-weight:600;margin:2px 0;letter-spacing:-.02em}
#cnt{color:var(--mut);font-size:13px}
.icon{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--mut)}
#tabs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:var(--sh);color:var(--mut);font-weight:500;transition:background .2s,color .2s}
.tab.on{background:var(--acc);color:var(--onacc)}
.tab.ghost{background:none;box-shadow:none;border:1px dashed var(--line)}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(120px + env(safe-area-inset-bottom))}
.blk{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:8px;transition:height .38s cubic-bezier(.4,0,.2,1),opacity .3s,margin .38s,box-shadow .2s;position:relative}
.blk.in{animation:inx .4s cubic-bezier(.2,.8,.2,1)}
.blk.collapse{height:0!important;opacity:0;margin-bottom:0;overflow:hidden}
.blk.drag{z-index:5;box-shadow:0 16px 36px rgba(0,0,0,.25);transition:none}
@keyframes inx{from{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes pop{40%{transform:scale(1.28)}100%{transform:scale(1)}}
.task{display:flex;align-items:flex-start;padding:4px 4px 4px 0}
.task.ng{padding-left:6px}
.task.sub{margin-left:34px;padding-top:0}
.grip{width:30px;height:44px;display:grid;place-items:center;color:var(--mut);opacity:.45;touch-action:none;cursor:grab;flex:none}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none}
.c{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;color:var(--onacc);transition:background .2s,border-color .2s}
.c svg{width:14px;height:14px}
.c path{stroke-dasharray:24;stroke-dashoffset:24}
.done .c{background:var(--acc);border-color:var(--acc)}
.done .c path{stroke-dashoffset:0;transition:stroke-dashoffset .3s .05s}
.pop .c{animation:pop .32s}
.body{flex:1;min-width:0;padding:10px 0;cursor:pointer}
.ttl{word-break:break-word;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.5px;transition:background-size .3s,color .3s}
.done .ttl{background-size:100% 1.5px;color:var(--mut)}
.nt{color:var(--mut);font-size:13px;line-height:19px;white-space:pre-wrap;word-break:break-word}
.meta{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:0 9px;border-radius:10px;background:var(--soft);font-size:12px;line-height:22px;color:var(--mut)}
.chip.late{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.star{width:44px;height:44px;font-size:21px;color:var(--mut);flex:none;transition:transform .2s}
.star.on{color:var(--acc)}
.star:active{transform:scale(1.3)}
.done-h{display:flex;align-items:center;gap:8px;height:44px;width:100%;color:var(--mut);font-weight:500;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:56px 0;animation:inx .5s}
.empty b{display:block;font-size:17px;color:var(--fg);margin-bottom:4px}
#fab{position:fixed;right:max(20px,calc(50% - 280px + 4px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--onacc);font-size:30px;line-height:1;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:8}
#fab:active{transform:scale(.9);opacity:1}
#fab.hide{transform:scale(0)}
#bd{position:fixed;inset:0;background:rgba(10,12,18,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
#bd.show{opacity:1;pointer-events:auto}
#panel{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90dvh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:20;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#panel.show{transform:none}
.bar{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#panel input,#panel textarea,#panel select{font:inherit;font-size:16px;color:inherit;width:100%;background:var(--soft);border:0;border-radius:12px;padding:12px 14px}
#panel textarea{resize:none;min-height:80px}
#panel input.big{font-size:20px;font-weight:600;background:none;padding:8px 0}
#panel label{display:block;color:var(--mut);font-size:12px;font-weight:500;margin:16px 0 6px}
.row2{display:flex;gap:8px;align-items:center}
.pill{height:40px;padding:0 16px;border-radius:20px;background:var(--soft);font-weight:500;white-space:nowrap}
.pill.main{background:var(--acc);color:var(--onacc);flex:1;height:48px;border-radius:24px}
.pill.del,.mi.del{color:var(--red)}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:52px;text-align:left;font-size:16px;border-top:1px solid var(--line)}
.mi span{width:22px;color:var(--acc)}
.stask{display:flex;align-items:center}
.stask .body{padding:6px 0}
.edt{max-width:560px;margin:8px auto 0;padding:0 16px}
.edt .card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 14px}
.edt h3{margin:0;font-size:15px;font-weight:600}
.edt .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.edt .seg{margin-left:auto;display:flex;background:var(--soft);border-radius:16px;padding:2px}
.edt .seg button{height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:500;color:var(--mut);transition:background .2s}
.edt .seg .on{background:var(--acc);color:var(--onacc)}
.les{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);animation:inx .35s}
.les .h{width:44px;flex:none;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.les .s{font-weight:500}
.les .r{color:var(--mut);font-size:12px}
.les.x .s{text-decoration:line-through;color:var(--mut)}
.les .chip{margin-left:6px}
.edt .mut{color:var(--mut);font-size:13px;padding:6px 0}
.edt .lnk{color:var(--acc);font-weight:500;height:36px}
body[data-tab=home] header,body[data-tab=home] #main,body[data-tab=home] #fab{display:none}
body[data-tab=tasks] #home{display:none}
#edt{display:none}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#fab{bottom:calc(78px + env(safe-area-inset-bottom))}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:12;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
.bw{display:flex;gap:8px;max-width:560px;margin:0 auto}
#bnav button{flex:1;height:52px;border-radius:14px;color:var(--mut);display:grid;place-items:center;align-content:center;font-size:12px;font-weight:500;line-height:15px;transition:color .2s,background .2s}
#bnav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent)}
#bnav b{font-size:19px;line-height:22px;font-weight:400}
#home{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.hh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hh .sub{color:var(--mut);font-size:13px;text-transform:capitalize}
.hc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.hc h3{margin:0;font-size:15px;font-weight:600}
.hero .k{color:var(--acc);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero .t{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.01em;margin:4px 0 2px;word-break:break-word}
.hero .m{color:var(--mut);font-size:13px}
.prog{height:6px;border-radius:3px;background:var(--soft);margin:14px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .6s}
.nx{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.ht{display:flex;align-items:center;margin-bottom:6px}
.ht .seg{margin-left:auto;display:flex;background:var(--soft);border-radius:16px;padding:2px}
.ht .seg button{height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:500;color:var(--mut);transition:background .2s}
.ht .seg .on{background:var(--acc);color:var(--onacc)}
.tl{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tl .h{width:46px;flex:none;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.tl .bx{flex:1;min-width:0}
.tl .s{font-weight:500;word-break:break-word}
.tl .s.dn{text-decoration:line-through;color:var(--mut)}
.tl .r{color:var(--mut);font-size:12px}
.tl.past{opacity:.45}
.tl.now{background:color-mix(in srgb,var(--acc) 9%,transparent);margin:0 -8px;padding:9px 8px;border-radius:12px;border-color:transparent}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);flex:none}
.ok{color:var(--acc);font-weight:600;width:30px;text-align:center}
.mu{color:var(--mut);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lnk2{height:36px;padding:0 12px;border-radius:18px;background:var(--soft);font-size:13px;font-weight:500}
.rates{display:flex;gap:8px;margin:14px 0}
.rt{flex:1;height:56px;border-radius:16px;background:var(--soft);font-size:26px;transition:transform .15s,background .2s}
.rt.on{background:color-mix(in srgb,var(--acc) 22%,transparent);transform:scale(1.08)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tg{height:36px;padding:0 14px;border-radius:18px;background:var(--soft);font-weight:500}
.tg.on{background:var(--acc);color:var(--onacc)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="in-w">
  <div class="hd"><div><div id="sub"></div><h1 id="title"></h1><div id="cnt"></div></div>
  <div><button class="icon" data-act="cfg" aria-label="Personnaliser">⚙</button><button class="icon" id="more" data-act="menu" aria-label="Options de la liste">⋮</button></div></div>
  <nav id="tabs" aria-label="Listes"></nav>
</div></header>
<input type="file" id="imp" accept="application/json,.json" hidden>
<div id="home"></div>
<section id="edt" class="edt"></section>
<main id="main"></main>
<button id="fab" data-act="new" aria-label="Nouvelle tâche">+</button>
<nav id="bnav" aria-label="Navigation"><div class="bw"><button data-act="tab" data-t="home"><b>◉</b>Principal</button><button data-act="tab" data-t="tasks"><b>✓</b>Tâches</button></div></nav>
<div id="bd" data-act="close"></div>
<div id="panel" role="dialog" aria-modal="true"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let S;try{S=JSON.parse(localStorage.getItem('gtasks'))}catch(e){}
S=S||{lists:[{id:'l1',name:'Mes tâches'}],tasks:[],cur:'l1',sort:'order',showDone:true};
const ui={sheet:null,open:null,fx:null,tab:'home',hd:0,rate:null};
S.cfg=Object.assign({wake:'07:00',sleep:'22:30',wakeWE:'09:00',sleepWE:'23:30',meals:[{n:'Repas',t:'19:00',d:45}],block:50,brk:10,subjects:'',fill:'1'},S.cfg||{});
S.log=S.log||[];S.rec=S.rec||[];S.morning=S.morning||[];S.late=S.late||[];S.special=S.special||[];
const save=()=>{try{localStorage.setItem('gtasks',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const inDays=n=>iso(new Date(Date.now()+n*864e5));
const fmt=d=>d===today()?'Aujourd’hui':d===inDays(1)?'Demain':new Date(d+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const get=id=>S.tasks.find(t=>t.id===id);
const curList=()=>S.lists.find(l=>l.id===S.cur);
const REP={'':'Ne se répète pas',d:'Tous les jours',w:'Toutes les semaines',m:'Tous les mois',y:'Tous les ans'};
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GRIP='<svg viewBox="0 0 10 16" width="10" height="16"><g fill="currentColor"><circle cx="2" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="2" cy="13" r="1.5"/><circle cx="8" cy="13" r="1.5"/></g></svg>';

function nextDate(date,r){const d=new Date((date||today())+'T00:00');
  if(r==='d')d.setDate(d.getDate()+1);if(r==='w')d.setDate(d.getDate()+7);
  if(r==='m')d.setMonth(d.getMonth()+1);if(r==='y')d.setFullYear(d.getFullYear()+1);return iso(d)}
function sorted(arr){const a=[...arr];
  if(S.sort==='date')a.sort((x,y)=>(x.date||'9')<(y.date||'9')?-1:(x.date||'9')>(y.date||'9')?1:0);
  if(S.sort==='title')a.sort((x,y)=>x.title.localeCompare(y.title,'fr'));
  return a}
function reorder(ids){const set=new Set(ids),pos=[],m={};
  S.tasks.forEach((t,i)=>{if(set.has(t.id)){pos.push(i);m[t.id]=t}});
  pos.forEach((p,k)=>S.tasks[p]=m[ids[k]])}

function row(t,sub,showList,grip){
  const l=showList?S.lists.find(x=>x.id===t.list):null;
  const chips=(t.date?`<span class="chip ${t.date<today()&&!t.done?'late':''}">${fmt(t.date)}${t.repeat?' ↻':''}</span>`:'')+(l?`<span class="chip">${esc(l.name)}</span>`:'');
  return `<div class="task ${sub?'sub':''} ${grip||sub?'':'ng'} ${t.done?'done':''}" data-id="${t.id}">
  ${grip?`<div class="grip" aria-hidden="true">${GRIP}</div>`:''}
  <button class="chk" data-act="toggle" aria-label="${t.done?'Marquer comme à faire':'Marquer comme terminée'}"><span class="c">${CHK}</span></button>
  <div class="body" data-act="open" tabindex="0"><div><span class="ttl">${esc(t.title)}</span></div>${t.notes?`<div class="nt">${esc(t.notes)}</div>`:''}${chips?`<div class="meta">${chips}</div>`:''}</div>
  <button class="star ${t.starred?'on':''}" data-act="star" aria-label="Favori">${t.starred?'★':'☆'}</button></div>`}
const block=(t,showList,grip)=>row(t,false,showList,grip)+S.tasks.filter(s=>s.parent===t.id).map(s=>row(s,true)).join('');

function renderHead(){
  const fav=S.cur==='starred',l=curList();
  const n=S.tasks.filter(t=>!t.parent&&!t.done&&(fav?t.starred:t.list===S.cur)).length;
  $('#sub').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('#title').textContent=fav?'Favoris':l.name;
  $('#cnt').textContent=n?`${n} à faire`:'Rien à faire';
  $('#more').style.display=fav?'none':'';
  $('#tabs').innerHTML=`<button class="tab ${fav?'on':''}" data-act="nav" data-id="starred">★ Favoris</button>`+
   S.lists.map(x=>`<button class="tab ${S.cur===x.id?'on':''}" data-act="nav" data-id="${x.id}">${esc(x.name)}</button>`).join('')+
   `<button class="tab ghost" data-act="newlist">+ Liste</button>`}
function revealTab(){const o=$('#tabs .on');o&&o.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}

function renderMain(){
  const fav=S.cur==='starred';
  const all=S.tasks.filter(t=>!t.parent&&(fav?t.starred:t.list===S.cur));
  const todo=sorted(all.filter(t=>!t.done)),done=all.filter(t=>t.done);
  const drag=!fav&&S.sort==='order'&&todo.length>1;
  const blk=(t,c,g)=>`<div class="blk ${c} ${ui.fx===t.id?'in':''}" data-id="${t.id}">${block(t,fav,g)}</div>`;
  $('#main').innerHTML=(todo.length?`<div id="list">${todo.map(t=>blk(t,'todo',drag)).join('')}</div>`
   :`<div class="empty"><b>${done.length?'Tout est fait':'Aucune tâche'}</b>${done.length?'Profite de ta journée.':'Touche + pour en ajouter une.'}</div>`)+
   (done.length?`<button class="done-h" data-act="showdone"><span>${S.showDone?'▾':'▸'}</span>Terminées (${done.length})</button>${S.showDone?done.map(t=>blk(t,'dn',false)).join(''):''}`:'');
  ui.fx=null}

function renderSheet(){
  const p=$('#panel'),s=ui.sheet;
  $('#bd').classList.toggle('show',!!s);p.classList.toggle('show',!!s);$('#fab').classList.toggle('hide',!!s);
  if(!s)return;
  if(s==='add'){
    p.innerHTML=`<div class="bar"></div><input class="big" id="nt" placeholder="Nouvelle tâche" autocomplete="off" enterkeyhint="done">
    <textarea id="nn" placeholder="Informations" style="margin-top:8px"></textarea>
    <label for="nd">Date</label><div class="row2"><input type="date" id="nd"><button class="pill" data-act="dt" data-v="0">Auj.</button><button class="pill" data-act="dt" data-v="1">Demain</button></div>
    <div class="row2" style="margin-top:20px"><button class="pill main" data-act="add">Enregistrer</button></div>`;
    setTimeout(()=>{const i=$('#nt');i&&i.focus()},150)}
  else if(s==='menu'){
    const so=(k,t)=>`<button class="mi" data-act="sort" data-k="${k}"><span>${S.sort===k?'✓':''}</span>${t}</button>`;
    p.innerHTML=`<div class="bar"></div><label style="margin-top:0">Trier par</label>${so('order','Mon ordre (glisser pour réorganiser)')}${so('date','Date')}${so('title','Titre')}
    <button class="mi" data-act="rename"><span>✎</span>Renommer la liste</button>
    <button class="mi" data-act="clear"><span>✓</span>Supprimer les tâches terminées</button>
    <button class="mi del" data-act="dellist" ${S.lists.length<2?'disabled style="opacity:.4"':''}><span style="color:inherit">🗑</span>Supprimer la liste</button>`}
  else if(s==='rate'){const r=ui.rate;if(!r){ui.sheet=null;return renderSheet()}
    p.innerHTML=`<div class="bar"></div><h3 style="margin:0 0 2px;font-size:18px">${esc(r.title)}</h3><div class="mu">Comment ça s’est passé ?</div>

function startDrag(e){
  const h=e.target.closest('.grip'),b=h.closest('.blk'),box=b.parentNode;
  e.preventDefault();h.setPointerCapture(e.pointerId);vib(12);
  let y0=e.clientY;b.classList.add('drag');b.style.transform='scale(1.02)';
  const mid=x=>{const q=x.getBoundingClientRect();return q.top+q.height/2};
  const mv=ev=>{
    b.style.transform=`translateY(${ev.clientY-y0}px) scale(1.02)`;
    const r=b.getBoundingClientRect(),c=r.top+r.height/2,p=b.previousElementSibling,n=b.nextElementSibling;
    const o=p&&c<mid(p)?p:n&&c>mid(n)?n:null;if(!o)return;
    const ot=o.getBoundingClientRect().top;
    o===p?box.insertBefore(b,p):box.insertBefore(n,b);
    y0+=b.getBoundingClientRect().top-r.top;
    b.style.transform=`translateY(${ev.clientY-y0}px) scale(1.02)`;
    const d=ot-o.getBoundingClientRect().top;
    o.style.transition='none';o.style.transform=`translateY(${d}px)`;o.offsetWidth;
    o.style.transition='transform .2s';o.style.transform='';vib(6)};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    b.style.transition='transform .18s';b.style.transform='';
    setTimeout(()=>{reorder([...box.children].map(x=>x.dataset.id));save();render()},190)};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}

async function loadEdt(){
  const pw=localStorage.getItem('edtpass');if(!pw){renderEdt();return}
  try{
    const r=await fetch('data/edt.enc.json?t='+Date.now());if(!r.ok)throw new Error('fichier');
    const j=await r.json(),enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('mon-cap-edt-v1'),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(j.iv)},k,b64u(j.data));
    const dj=JSON.parse(new TextDecoder().decode(p));E.lessons=dj.lessons;E.err='';importHw(dj.homework||[]);
    try{localStorage.setItem('edtcache',JSON.stringify(E.lessons))}catch(e){}
  }catch(e){E.err=e.message==='fichier'?'Synchro introuvable.':e.name==='TypeError'?(E.lessons?'Hors ligne : dernière synchro affichée.':'Hors ligne.'):'Mot de passe de chiffrement incorrect ou synchro indisponible.'}
  renderEdt()}

const toMin=s=>+s.slice(0,2)*60+ +s.slice(3,5);
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const addDay=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return new Date(y,Math.floor((h+l-7*m+114)/31)-1,(h+l-7*m+114)%31+1)};
function holiday(d){const y=+d.slice(0,4),e=easter(y),at=n=>iso(new Date(y,e.getMonth(),e.getDate()+n));
  const fx={'01-01':'Jour de l’An','05-01':'Fête du Travail','05-08':'Victoire 1945','07-14':'Fête nationale','08-15':'Assomption','11-01':'Toussaint','11-11':'Armistice','12-25':'Noël'};
  return fx[d.slice(5)]||({[at(1)]:'Lundi de Pâques',[at(39)]:'Ascension',[at(50)]:'Lundi de Pentecôte'})[d]||null}
function dayInfo(d){const w=new Date(d+'T00:00').getDay(),hol=holiday(d),sp=S.special.filter(x=>x.d===d);return{w,hol,sp,off:!!hol||sp.some(x=>x.k!=='note')}}
function subjAvg(before){const m={},o={};S.log.filter(x=>x.r&&x.subject&&x.d<before).forEach(x=>(m[x.subject]=m[x.subject]||[]).push(x.r));for(const k in m)o[k]=avg(m[k]);return o}
function subjectsList(d){
  const c=S.cfg.subjects.split(',').map(x=>x.trim()).filter(Boolean);
  const base=c.length?c:[...new Set((E.lessons||[]).filter(l=>!l.canceled).map(l=>l.subject).filter(Boolean))];
  const nx=new Set((E.lessons||[]).filter(l=>l.start.slice(0,10)===addDay(d,1)&&!l.canceled).map(l=>(l.subject||'').toLowerCase()));
  const av=subjAvg(d);
  return base.sort((a,b)=>((nx.has(a.toLowerCase())?0:1)-(nx.has(b.toLowerCase())?0:1))||((av[a]??3)-(av[b]??3))||a.localeCompare(b,'fr'))}
function plan(d){
  const c=S.cfg,di=dayInfo(d),w=di.off?0:di.w,we=w===0||w===6,fixed=[],out=[];
  const wake=toMin(we&&c.wakeWE?c.wakeWE:c.wake),sleep=toMin(we&&c.sleepWE?c.sleepWE:c.sleep);
  let t0=wake;S.morning.forEach(x=>{fixed.push({s:t0,e:t0+x.m,t:'routine',title:x.l});t0+=x.m});
  const W=t0,la=S.late.reduce((a,x)=>a+x.m,0),Z=sleep-(la||30);let t1=Z;
  S.late.forEach(x=>{fixed.push({s:t1,e:t1+x.m,t:'routine',title:x.l});t1+=x.m});
  if(!di.off)(E.lessons||[]).filter(l=>l.start.slice(0,10)===d&&!l.canceled).forEach(l=>fixed.push({s:toMin(l.start.slice(11,16)),e:toMin(l.end.slice(11,16)),t:'cours',title:l.subject||'Cours',sub:[l.room,l.status].filter(Boolean).join(' · ')}));
  S.rec.filter(r=>r.d.includes(w)&&r.s&&r.e).forEach(r=>fixed.push({s:toMin(r.s),e:toMin(r.e),t:'fixe',title:r.l||'Obligation'}));
  const free=(s,e)=>!fixed.some(b=>s<b.e&&e>b.s);
  c.meals.forEach(m=>{const s=toMin(m.t),du=+m.d||30;for(const o of [0,15,-15,30,-30,45,-45,60,-60,90,-90,120,-120]){if(free(s+o,s+o+du)){fixed.push({s:s+o,e:s+o+du,t:'repas',title:m.n||'Repas'});return}}});
  fixed.sort((a,b)=>a.s-b.s);
  const gaps=[];let cur=W;
  fixed.forEach(b=>{const e=Math.min(b.s,Z);if(e-cur>0)gaps.push([cur,e]);cur=Math.max(cur,b.e)});
  if(Z-cur>0)gaps.push([cur,Z]);
  const key=t=>[t.starred?0:1,t.date||'9',t.created||0];
  const q=S.tasks.filter(t=>!t.parent&&((!t.done&&(!t.date||t.date<=d||(t.hw&&t.date<=addDay(d,3))))||(t.done&&t.doneAt===d))).sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||(x[1]<y[1]?-1:x[1]>y[1]?1:0)||x[2]-y[2]})
    .map(t=>({t:'task',title:t.title,id:t.id,done:t.done,dur:+t.dur||0}));
  const subs=subjectsList(d);let ri=0;
  const next=()=>{if(q.length)return q.shift();if(c.fill==='0'||S.light===d)return null;if(!subs.length)return{t:'revision',title:'Session de révision',subject:'Révision'};const m=subs[ri++%subs.length];return{t:'revision',title:'Réviser · '+m,subject:m}};
  const lt=S.light===d,R=S.resume&&S.resume.d===d?S.resume.m:0;
  const bl=lt?30:(+c.block||50),br=lt?15:(+c.brk||10);
  gaps.forEach(([s0,e])=>{let t=Math.max(s0,R);
    while(e-t>=25){const it=next();if(!it)break;let len=Math.min(it.dur||bl,e-t);if(it.t==='revision'&&e-t-len<25)len=e-t;out.push({s:t,e:t+len,...it});t+=len;
      if(e-t>=br+25){out.push({s:t,e:t+br,t:'pause',title:'Pause'});t+=br}}
    if(e-t>=5)out.push({s:t,e,t:'pause',title:'Temps libre'})});
  const all=[...fixed,...out].sort((a,b)=>a.s-b.s);
  all.forEach(b=>{b.d=d;if(b.t==='revision')b.done=S.log.some(x=>x.bk===d+':'+b.s)});
  return all}
const parseRt=v=>v.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)[,;\s]+(\d+)\s*(min)?$/i);return m?{l:m[1].trim(),m:+m[2]}:{l:x,m:5}});
/*ENDPURE*/
const hue=x=>{let h=0;for(const ch of x||'')h=(h*31+ch.charCodeAt(0))%360;return h};
const dot=b=>b.t==='cours'||b.t==='revision'?`<i class="dot" style="background:hsl(${hue(b.subject||b.title)} 62% 62%)"></i>`:'';
const TYPE={cours:'Cours',repas:'Repas',task:'Tâche',revision:'Révision',pause:'Pause',routine:'Routine',fixe:'Obligation'};
const KS={greve:'Grève / pas de cours',libre:'Jour libre',note:'Cours maintenus (simple note)'};
const DL=['D','L','M','M','J','V','S'],DORD=[1,2,3,4,5,6,0];
const pr=(l,s,e,d)=>({l,s,e,d});
const WD=[1,2,3,4,5];
const WZ=[
 {t:'times',h:'Réveil et coucher',p:'Pour savoir quand ta journée commence et finit.',f:[['wake','Réveil (semaine)','time'],['sleep','Coucher (semaine)','time'],['wakeWE','Réveil (week-end, jours fériés)','time'],['sleepWE','Coucher (week-end)','time']]},
 {t:'meals',h:'Tes repas',p:'Combien de repas par jour, et à quelle heure ? (OMAD = un seul.)'},
 {t:'blocks',g:'internat',h:'Internat',p:'Tout ce qui est imposé : perm, étude, heures de repas, extinction… Ajuste les heures et les jours.',pre:[pr('Perm obligatoire','16:00','17:00',WD),pr('Étude du soir','19:30','21:00',[1,2,3,4]),pr('Heure imposée (repas, appel…)','18:30','19:00',WD),pr('Extinction des feux','22:00','22:30',[0,1,2,3,4])]},
 {t:'blocks',g:'soir',h:'Tes soirs',p:'Après les cours, du lundi au vendredi : sport, club, transport, rendez-vous réguliers…',pre:[pr('Sport','18:00','19:00',[2,4]),pr('Club / activité','17:30','18:30',[1]),pr('Transport','17:00','17:30',WD)]},
 {t:'blocks',g:'mercredi',h:'Mercredi après-midi',p:'Qu’est-ce qui est déjà prévu ? Le reste sera du temps libre à remplir.',pre:[pr('Sport / activité','14:00','16:00',[3]),pr('Rendez-vous','15:00','16:00',[3]),pr('Retour à l’internat','17:00','17:30',[3])]},
 {t:'blocks',g:'weekend',h:'Week-end',p:'Samedi et dimanche : activités fixes, retour à l’internat, famille…',pre:[pr('Sport','10:00','11:30',[6]),pr('Famille / sortie','14:00','18:00',[6,0]),pr('Retour à l’internat','18:00','19:00',[0])]},
 {t:'routine',k:'morning',h:'Routine du matin',p:'Une étape par ligne : nom puis minutes. Elle commence à ton réveil, à la minute près.'},
 {t:'routine',k:'late',h:'Routine du soir',p:'Une étape par ligne : nom puis minutes. Elle se termine à ton coucher.'},
 {t:'times',h:'Travail',p:'Comment tu veux que je remplisse tes trous.',f:[['block','Durée d’une session (min)','number'],['brk','Pause entre deux sessions (min)','number'],['subjects','Matières à réviser (virgules, vide = tes cours)','text'],['fill','Remplir avec des révisions quand il n’y a plus de tâches ?','fill']]}
];
function rowHTML(r){return`<div class="rrow"><div class="row2"><input data-rf="l" data-id="${r.id}" value="${esc(r.l)}" placeholder="Intitulé"><button class="icon" data-act="rdel" data-id="${r.id}" aria-label="Supprimer">✕</button></div><div class="row2" style="margin-top:6px"><input type="time" data-rf="s" data-id="${r.id}" value="${r.s}"><input type="time" data-rf="e" data-id="${r.id}" value="${r.e}"></div><div class="row2" style="margin-top:8px;justify-content:space-between">${DORD.map(w=>`<button class="dch ${r.d.includes(w)?'on':''}" data-act="rday" data-id="${r.id}" data-w="${w}">${DL[w]}</button>`).join('')}</div></div>`}
function wizHTML(){const i=ui.wiz,st=WZ[i];let b='';
  if(st.t==='times')b=st.f.map(([k,l,ty])=>ty==='fill'?`<label>${l}</label><select data-c="fill"><option value="1" ${S.cfg.fill!=='0'?'selected':''}>Oui</option><option value="0" ${S.cfg.fill==='0'?'selected':''}>Non, seulement mes tâches</option></select>`:`<label>${l}</label><input data-c="${k}" type="${ty}" value="${esc(S.cfg[k]||'')}" ${ty==='number'?'inputmode="numeric"':''}>`).join('');
  if(st.t==='meals')b=S.cfg.meals.map((m,j)=>`<div class="rrow"><div class="row2"><input data-mf="n" data-m="${j}" value="${esc(m.n)}"><button class="icon" data-act="mdel" data-j="${j}" aria-label="Supprimer">✕</button></div><div class="row2" style="margin-top:6px"><input type="time" data-mf="t" data-m="${j}" value="${m.t}"><input type="number" inputmode="numeric" data-mf="d" data-m="${j}" value="${m.d}" aria-label="Durée en minutes"></div></div>`).join('')+`<div class="row2"><button class="pill" data-act="madd">+ Repas</button><button class="pill" data-act="momad">Un seul repas (OMAD)</button></div><div class="mu" style="margin-top:8px">Heure, puis durée en minutes. Je décale le repas si un cours tombe dessus.</div>`;
  if(st.t==='blocks')b=S.rec.filter(r=>r.g===st.g).map(rowHTML).join('')+`<div class="tags">${st.pre.map((p,j)=>`<button class="tg" data-act="radd" data-pi="${j}">+ ${esc(p.l)}</button>`).join('')}<button class="tg" data-act="radd" data-pi="-1">+ Autre</button></div>`;
  if(st.t==='routine')b=`<textarea data-ta="${st.k}" rows="8" placeholder="Réveil, 5&#10;Douche, 10">${esc(S[st.k].map(x=>x.l+', '+x.m).join('\n'))}</textarea><div class="mu" style="margin-top:6px">Exemple : « Douche, 10 ».</div>`;
  return`<div class="bar"></div><div class="prog" style="margin-top:0"><i style="width:${(i+1)/WZ.length*100}%"></i></div><div class="mu">Question ${i+1} sur ${WZ.length}</div><h3 style="margin:2px 0 4px;font-size:20px">${st.h}</h3><div class="mu">${st.p||''}</div>${b}<div class="row2" style="margin-top:20px">${i?`<button class="pill" data-act="wprev">Retour</button>`:''}<span style="flex:1"></span><button class="pill main" style="flex:none;padding:0 28px" data-act="wnext">${i===WZ.length-1?'Terminer':'Suivant'}</button></div>`}
function specHTML(){const td=today(),L=S.special.filter(x=>x.d>=td).sort((a,b)=>a.d<b.d?-1:1);
  return`<div class="bar"></div><h3 style="margin:0 0 4px;font-size:18px">Jours spéciaux</h3><div class="mu">Grève, jour libre… Ce jour-là, je retire les cours et j’adapte le planning.</div>
  ${L.map(x=>`<div class="rrow row2" style="justify-content:space-between;margin-top:10px"><div><b>${fmt(x.d)}</b> · ${KS[x.k]}${x.n?`<div class="mu">${esc(x.n)}</div>`:''}</div><button class="icon" data-act="spdel" data-id="${x.id}" aria-label="Supprimer">✕</button></div>`).join('')}
  <label>Nouveau jour spécial</label><input type="date" id="sd" value="${addDay(td,1)}"><select id="sk" style="margin-top:8px">${Object.entries(KS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="sn" placeholder="Note (facultatif)" style="margin-top:8px">
  <div class="row2" style="margin-top:16px"><button class="pill" data-act="close">Fermer</button><button class="pill main" data-act="spadd">Ajouter</button></div>`}

function chartHTML(){
  const td=today(),days=[...Array(7)].map((_,i)=>addDay(td,i-6));
  const data=days.map(d=>{const L=S.log.filter(x=>x.d===d);return{d,n:L.length,a:avg(L.filter(x=>x.r).map(x=>x.r))}});
  const mx=Math.max(3,...data.map(x=>x.n)),all=S.log.filter(x=>x.d>=days[0]);
  if(!S.log.length)return`<div class="mu" style="padding:8px 0">Termine une tâche ou une session : ton suivi apparaîtra ici.</div>`;
  const bars=data.map((x,i)=>{const h=x.n?Math.max(8,x.n/mx*78):3,xx=14+i*43,y=104-h;
    return`<rect x="${xx}" y="${y}" width="28" height="${h}" rx="7" fill="var(--acc)" opacity="${x.n?(.3+.7*((x.a||3)/5)).toFixed(2):.2}"/>${x.a?`<text x="${xx+14}" y="${y-5}" text-anchor="middle" font-size="11" fill="var(--mut)">${x.a.toFixed(1)}</text>`:''}<text x="${xx+14}" y="122" text-anchor="middle" font-size="11" fill="var(--mut)">${new Date(x.d+'T00:00').toLocaleDateString('fr-FR',{weekday:'narrow'}).toUpperCase()}</text>`}).join('');
  const m={};S.log.filter(x=>x.r&&x.subject).forEach(x=>(m[x.subject]=m[x.subject]||[]).push(x.r));
  const weak=Object.entries(m).map(([k,v])=>[k,avg(v),v.length]).sort((a,b)=>a[1]-b[1]).slice(0,2);
  const ar=avg(all.filter(x=>x.r).map(x=>x.r));
  return`<svg viewBox="0 0 320 128" width="100%" role="img" aria-label="Sessions des 7 derniers jours">${bars}</svg>
  <div class="mu">${all.length} session${all.length>1?'s':''} sur 7 jours${ar?` · humeur moyenne ${ar.toFixed(1)}/5`:''}</div>
  ${weak.length?`<div class="nx">À renforcer : ${weak.map(w=>`${esc(w[0])} (${w[1].toFixed(1)}/5)`).join(', ')}</div>`:''}`}
function renderHome(){
  if(ui.tab!=='home')return;
  const td=today(),n=nowMin(),pl=plan(td);
  const cur=pl.find(b=>b.s<=n&&n<b.e),nx=pl.find(b=>b.s>=(cur?cur.e:n+1)&&b.t!=='pause');
  let hero;
  if(cur){const left=cur.e-n,lt=left>=60?Math.floor(left/60)+' h '+String(left%60).padStart(2,'0'):left+' min';
    const k=({cours:'Cours en ce moment',repas:'Repas',pause:'Pause',routine:'Routine',fixe:'Obligation'})[cur.t]||(cur.done?'Fait ✓':'À faire maintenant');
    hero=`<div class="k">${k}</div><div class="t">${dot(cur)}${esc(cur.title)}</div><div class="m">${hhmm(cur.s)} – ${hhmm(cur.e)} · encore ${lt}${cur.sub?' · '+esc(cur.sub):''}</div><div class="prog"><i style="width:${Math.round((n-cur.s)/(cur.e-cur.s)*100)}%"></i></div>
    ${(cur.t==='task'||cur.t==='revision')&&!cur.done?`<button class="pill main" style="width:100%;margin-top:8px" data-act="blk" data-d="${td}" data-s="${cur.s}">Terminé ✓</button>`:''}
    ${nx?`<div class="nx">Ensuite · ${hhmm(nx.s)} ${esc(nx.title)}</div>`:''}
    <div class="row2" style="margin-top:12px"><button class="lnk2" data-act="resume">↻ J’ai pris du retard</button><button class="lnk2" data-act="light">${S.light===td?'Reprendre le rythme normal':'☾ Journée légère'}</button></div>`}
  else if(nx){hero=`<div class="k">Bientôt</div><div class="t">${esc(nx.title)}</div><div class="m">à ${hhmm(nx.s)}</div>`}
  else{const tm=plan(addDay(td,1)).find(b=>b.t!=='pause'&&b.t!=='repas');
    hero=`<div class="k">Journée terminée</div><div class="t">Repose-toi</div><div class="m">${tm?'Demain, '+hhmm(tm.s)+' : '+esc(tm.title):'Rien de prévu demain.'}</div>`}
  const hd=ui.hd,dd=addDay(td,hd),tp=hd?plan(dd):pl;
  const rows=tp.map(b=>`<div class="tl ${hd===0&&b.e<=n?'past':''} ${hd===0&&b.s<=n&&n<b.e?'now':''}"><div class="h">${hhmm(b.s)}</div><div class="bx"><div class="s ${b.done?'dn':''}">${dot(b)}${esc(b.title)}</div><div class="r">${TYPE[b.t]} · ${b.e-b.s} min${b.sub?' · '+esc(b.sub):''}</div></div>${(b.t==='task'||b.t==='revision')&&!b.done?`<button class="ck" data-act="blk" data-d="${dd}" data-s="${b.s}" aria-label="Terminé"></button>`:b.done?'<span class="ok">✓</span>':''}</div>`).join('');
  const warn=!localStorage.getItem('edtpass')?`<div class="hc"><div class="mu">Connecte tes cours Pronote pour que le planning tienne compte de ton emploi du temps.</div><button style="color:var(--acc);font-weight:500;height:36px" data-act="edtpw">Entrer le mot de passe</button></div>`:E.err?`<div class="hc mu" style="color:var(--red)">${E.err}</div>`:'';
  $('#home').innerHTML=`<div class="hh"><div><div class="sub">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}${dayInfo(td).hol?' · '+esc(dayInfo(td).hol):''}</div><h1>Principal</h1></div><button class="icon" data-act="cfg" aria-label="Personnaliser">⚙</button></div>
  ${S.setup?'':`<div class="hc"><h3>Faisons connaissance</h3><div class="mu" style="margin:4px 0 10px">Réponds à quelques questions sur ton emploi du temps (internat, repas, soirs, week-end, routines) pour que je planifie vraiment tes journées.</div><button class="pill main" style="width:100%" data-act="wiz">Commencer le questionnaire</button></div>`}${warn}${(()=>{const di=dayInfo(td);return di.hol||di.sp.length?`<div class="hc mu">${di.hol?'Jour férié : '+esc(di.hol)+'. ':''}${di.sp.map(x=>KS[x.k]+(x.n?' ('+esc(x.n)+')':'')).join(', ')}</div>`:''})()}<div class="hc hero">${hero}</div>
  <div class="hc"><div class="ht"><h3>Ma journée</h3><div class="seg"><button class="${hd===0?'on':''}" data-act="hday" data-d="0">Auj.</button><button class="${hd===1?'on':''}" data-act="hday" data-d="1">Demain</button></div></div>${rows||'<div class="mu">Rien de prévu.</div>'}</div>
  <div class="hc"><h3 style="margin-bottom:8px">Mon suivi</h3>${chartHTML()}</div>`}
function renderNav(){document.body.dataset.tab=ui.tab;document.querySelectorAll('#bnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===ui.tab))}

if(!curList()&&S.cur!=='starred')S.cur=S.lists[0].id;
