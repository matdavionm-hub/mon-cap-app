<html lang="fr">
<head>

<title>Mon Cap</title>

<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#16181d;--mut:#6b7280;--line:#e6e8ec;--soft:#eef0f4;--acc:#3b5bdb;--onacc:#fff;--red:#d6336c;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#eceef2;--mut:#9097a3;--line:#262a32;--soft:#222630;--acc:#8ea2ff;--onacc:#0f1115;--red:#ff8fb1;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/22px Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:active{opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.body:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.in-w{max-width:560px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
#sub{color:var(--mut);font-size:13px;text-transform:capitalize}
h1{font-size:28px;line-height:34px;font-weight:600;margin:2px 0;letter-spacing:-.02em}
#cnt{color:var(--mut);font-size:13px}
.icon{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--mut)}
#tabs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:var(--sh);color:var(--mut);font-weight:500;transition:background .2s,color .2s}
.tab.on{background:var(--acc);color:var(--onacc)}
.tab.ghost{background:none;box-shadow:none;border:1px dashed var(--line)}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(120px + env(safe-area-inset-bottom))}
.blk{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:8px;transition:height .38s cubic-bezier(.4,0,.2,1),opacity .3s,margin .38s,box-shadow .2s;position:relative}
.blk.in{animation:inx .4s cubic-bezier(.2,.8,.2,1)}
.blk.collapse{height:0!important;opacity:0;margin-bottom:0;overflow:hidden}
.blk.drag{z-index:5;box-shadow:0 16px 36px rgba(0,0,0,.25);transition:none}
@keyframes inx{from{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes pop{40%{transform:scale(1.28)}100%{transform:scale(1)}}
.task{display:flex;align-items:flex-start;padding:4px 4px 4px 0}
.task.ng{padding-left:6px}
.task.sub{margin-left:34px;padding-top:0}
.grip{width:30px;height:44px;display:grid;place-items:center;color:var(--mut);opacity:.45;touch-action:none;cursor:grab;flex:none}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none}
.c{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;color:var(--onacc);transition:background .2s,border-color .2s}
.c svg{width:14px;height:14px}
.c path{stroke-dasharray:24;stroke-dashoffset:24}
.done .c{background:var(--acc);border-color:var(--acc)}
.done .c path{stroke-dashoffset:0;transition:stroke-dashoffset .3s .05s}
.pop .c{animation:pop .32s}
.body{flex:1;min-width:0;padding:10px 0;cursor:pointer}
.ttl{word-break:break-word;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.5px;transition:background-size .3s,color .3s}
.done .ttl{background-size:100% 1.5px;color:var(--mut)}
.nt{color:var(--mut);font-size:13px;line-height:19px;white-space:pre-wrap;word-break:break-word}
.meta{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:0 9px;border-radius:10px;background:var(--soft);font-size:12px;line-height:22px;color:var(--mut)}
.chip.late{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.star{width:44px;height:44px;font-size:21px;color:var(--mut);flex:none;transition:transform .2s}
.star.on{color:var(--acc)}
.star:active{transform:scale(1.3)}
.done-h{display:flex;align-items:center;gap:8px;height:44px;width:100%;color:var(--mut);font-weight:500;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:56px 0;animation:inx .5s}
.empty b{display:block;font-size:17px;color:var(--fg);margin-bottom:4px}
#fab{position:fixed;right:max(20px,calc(50% - 280px + 4px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--onacc);font-size:30px;line-height:1;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:8}
#fab:active{transform:scale(.9);opacity:1}
#fab.hide{transform:scale(0)}
#bd{position:fixed;inset:0;background:rgba(10,12,18,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
#bd.show{opacity:1;pointer-events:auto}
#panel{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90dvh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:20;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#panel.show{transform:none}
.bar{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#panel input,#panel textarea,#panel select{font:inherit;font-size:16px;color:inherit;width:100%;background:var(--soft);border:0;border-radius:12px;padding:12px 14px}
#panel textarea{resize:none;min-height:80px}
#panel input.big{font-size:20px;font-weight:600;background:none;padding:8px 0}
#panel label{display:block;color:var(--mut);font-size:12px;font-weight:500;margin:16px 0 6px}
.row2{display:flex;gap:8px;align-items:center}
.pill{height:40px;padding:0 16px;border-radius:20px;background:var(--soft);font-weight:500;white-space:nowrap}
.pill.main{background:var(--acc);color:var(--onacc);flex:1;height:48px;border-radius:24px}
.pill.del,.mi.del{color:var(--red)}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:52px;text-align:left;font-size:16px;border-top:1px solid var(--line)}
.mi span{width:22px;color:var(--acc)}
.stask{display:flex;align-items:center}
.stask .body{padding:6px 0}
.edt{max-width:560px;margin:8px auto 0;padding:0 16px}
.edt .card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 14px}
.edt h3{margin:0;font-size:15px;font-weight:600}
.edt .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.edt .seg{margin-left:auto;display:flex;background:var(--soft);border-radius:16px;padding:2px}
.edt .seg button{height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:500;color:var(--mut);transition:background .2s}
.edt .seg .on{background:var(--acc);color:var(--onacc)}
.les{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);animation:inx .35s}
.les .h{width:44px;flex:none;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.les .s{font-weight:500}
.les .r{color:var(--mut);font-size:12px}
.les.x .s{text-decoration:line-through;color:var(--mut)}
.les .chip{margin-left:6px}
.edt .mut{color:var(--mut);font-size:13px;padding:6px 0}
.edt .lnk{color:var(--acc);font-weight:500;height:36px}
body[data-tab=home] header,body[data-tab=home] #main,body[data-tab=home] #fab{display:none}
body[data-tab=tasks] #home{display:none}
#edt{display:none}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#fab{bottom:calc(78px + env(safe-area-inset-bottom))}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:12;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
.bw{display:flex;gap:8px;max-width:560px;margin:0 auto}

#bnav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent)}

#home{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.hh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hh .sub{color:var(--mut);font-size:13px;text-transform:capitalize}
.hc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.hc h3{margin:0;font-size:15px;font-weight:600}
.hero .k{color:var(--acc);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}

.tl{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

.tl.past{opacity:.45}
.tl.now{background:color-mix(in srgb,var(--acc) 9%,transparent);margin:0 -8px;padding:9px 8px;border-radius:12px;border-color:transparent}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);flex:none}
.ok{color:var(--acc);font-weight:600;width:30px;text-align:center}
.mu{color:var(--mut);font-size:13px}
body[data-tab=agenda] header,body[data-tab=agenda] #main,body[data-tab=agenda] #fab,body[data-tab=agenda] #home{display:none}
body[data-tab=home] #agenda,body[data-tab=tasks] #agenda{display:none}
#agenda{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.today{box-shadow:0 0 0 2px var(--acc)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}

.mc.em{background:none}
.dots{display:flex;gap:3px;height:6px;margin-top:3px}
.dots i{width:5px;height:5px;border-radius:50%}
.hab{display:flex;align-items:center;gap:12px;width:100%;height:46px;border-top:1px solid var(--line)}
.hk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-size:13px;flex:none}
.hab.on .hk{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.al{border-left:3px solid var(--acc);padding:12px 8px 12px 14px;font-size:14px}
.tl .bx{cursor:pointer}
.k2{color:var(--acc);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.nt2{white-space:pre-wrap;word-break:break-word;margin:10px 0;padding:12px;background:var(--soft);border-radius:12px;font-size:14px}
.nt2 a,.fl{color:var(--acc)}
.fl{display:block;padding:10px 0;border-top:1px solid var(--line);font-weight:500;word-break:break-word}
.stp{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stp b{color:var(--acc);width:62px;flex:none;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lnk2{height:36px;padding:0 12px;border-radius:18px;background:var(--soft);font-size:13px;font-weight:500}
.rates{display:flex;gap:8px;margin:14px 0}
.rt{flex:1;height:56px;border-radius:16px;background:var(--soft);font-size:26px;transition:transform .15s,background .2s}
.rt.on{background:color-mix(in srgb,var(--acc) 22%,transparent);transform:scale(1.08)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tg{height:36px;padding:0 14px;border-radius:18px;background:var(--soft);font-weight:500}
.tg.on{background:var(--acc);color:var(--onacc)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* feuilles plus ergonomiques : en-tête et boutons toujours visibles */
.sh{position:sticky;top:-10px;z-index:4;margin:-10px -20px 0;padding:10px 20px 6px;background:var(--card)}
.sh .bar{margin:0 auto 10px}
.sh .x{position:absolute;right:14px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--mut);font-size:15px;display:grid;place-items:center}
.foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));z-index:4;display:flex;gap:10px;align-items:center;margin:18px -20px calc(-24px - env(safe-area-inset-bottom));padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -1px 0 var(--line)}
.foot .pill{flex:none;padding:0 20px}.foot .pill.main{flex:1}
.cs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.cs .chip{line-height:28px;padding:0 12px;border-radius:14px;font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}

.card2{background:var(--soft);border-radius:16px;padding:2px 14px}
.card2>*:first-child{border-top:0}
.it{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}

.wk .wb{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.wk .wb i{display:block;height:100%;background:var(--acc);border-radius:3px}

.addb{display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-top:10px;border-radius:24px;background:var(--soft);font-weight:500;color:var(--acc)}

<body>
<header><div class="in-w">
  <div class="hd"><div><div id="sub"></div><h1 id="title"></h1><div id="cnt"></div></div>
  <div><button class="icon" id="srch" data-act="search" aria-label="Rechercher">🔍</button><button class="icon" data-act="cfg" aria-label="Personnaliser">⚙</button><button class="icon" id="more" data-act="menu" aria-label="Options de la liste">⋮</button></div></div>
  <nav id="tabs" aria-label="Listes"></nav>
  <div id="sbar" hidden><input id="q" type="search" placeholder="Rechercher une tâche…" autocomplete="off"></div>
</div></header>
<input type="file" id="imp" accept="application/json,.json" hidden>
<div id="home"></div>
<div id="agenda"></div>
<section id="edt" class="edt"></section>
<main id="main"></main>
<button id="fab" data-act="new" aria-label="Nouvelle tâche">+</button>
<nav id="bnav" aria-label="Navigation"><div class="bw"><button data-act="tab" data-t="home"><b>◉</b>Principal</button><button data-act="tab" data-t="tasks"><b>✓</b>Tâches</button><button data-act="tab" data-t="agenda"><b>▦</b>Agenda</button></div></nav>
<div id="toast"></div>
<div id="bd" data-act="close"></div>
<div id="panel" role="dialog" aria-modal="true"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let S;try{S=JSON.parse(localStorage.getItem('gtasks'))}catch(e){}
S=S||{lists:[{id:'l1',name:'Mes tâches'}],tasks:[],cur:'l1',sort:'order',showDone:true};
const ui={sheet:null,open:null,fx:null,tab:'home',hd:0,rate:null,ag:{mode:'week',off:0}};
S.cfg=Object.assign({wake:'07:00',sleep:'22:30',wakeWE:'09:00',sleepWE:'23:30',wakeOff:'08:00',sleepOff:'22:00',busOn:'1',busStopAM:'LR',busLinesAM:'E91',busStopPM:'LV',busLinesPM:'both',busSchool:'AP',busWalk:10,busMargin:5,busHomeWalk:5,catchMin:90,vacAuto:'1',theme:'auto',acc:'indigo',fs:'m',gripR:'0',fabL:'0',notifOn:'0',meals:[{n:'Repas',t:'19:00',d:45}],block:50,brk:10,subjects:'',fill:'1',weWork:3,internat:{1:'17:00',2:'17:00',3:'13:00',4:'17:00',5:'',6:'',0:''}},S.cfg||{});S.cut=S.cut||{};S.places=S.places||[{id:'music',n:'Salle de musique',w:{1:[[480,690],[780,1020]],2:[[480,690],[780,1020]],3:[[480,690]],4:[[480,690],[780,1020]],5:[[480,690],[780,1020]]}}];S.mornDay=S.mornDay||{};S.cfg.wakeDay=S.cfg.wakeDay||{};S.habits=S.habits||[];S.hlog=S.hlog||{};S.day=S.day||{};S.alerts=S.alerts||[];S.exams=S.exams||[];S.prepChk=S.prepChk||{};
S.log=S.log||[];S.rec=S.rec||[];S.morning=S.morning||[];S.late=S.late||[];S.special=S.special||[];
let svWarn=0;const save=()=>{try{localStorage.setItem('gtasks',JSON.stringify(S))}catch(e){if(!svWarn++)alert('Stockage du téléphone plein : tes dernières modifications ne sont pas enregistrées. Fais une sauvegarde dans les réglages.')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const inDays=n=>iso(new Date(Date.now()+n*864e5));
const subjShort=x=>String(x||'').split(' : ')[0].slice(0,32);
const splitT=t=>{const i=t.indexOf(' : ');return i>0&&i<40?[t.slice(0,i),t.slice(i+3)]:[t,'']};
/* nettoyage : garde l'app légère sur le long terme */
{const lim=inDays(-120),cl=inDays(-14),dead=new Set();S.tasks.forEach(t=>{if(t.done&&!t.repeat&&!t.parent&&t.doneAt&&t.doneAt<lim)dead.add(t.id)});if(dead.size)S.tasks=S.tasks.filter(t=>!dead.has(t.id)&&!dead.has(t.parent));for(const k in S.cut)if(k.slice(0,10)<cl)delete S.cut[k];if((S.log||[]).length>6000)S.log=S.log.slice(-6000);(S.log||[]).forEach(x=>{if(x.subject&&x.subject.includes(' : '))x.subject=x.subject.split(' : ')[0]})}
const isCx=l=>l.canceled||(S.cx&&S.cx[l.start]);
const inView=t=>{if(ui.q){const q=ui.q.toLowerCase(),h=x=>((x.title||'')+' '+(x.notes||'')).toLowerCase().includes(q);return h(t)||S.tasks.some(x=>x.parent===t.id&&h(x))}return S.cur==='starred'?t.starred:S.cur==='tomorrow'?t.date===addDay(today(),1):t.list===S.cur};
S.cx=S.cx||{};{const k=iso(new Date(Date.now()-14*864e5));for(const x in S.cx)if(x.slice(0,10)<k)delete S.cx[x]}
{let dl=S.lists.find(l=>l.daily)||S.lists.find(l=>/journali/i.test(l.name));if(!dl){dl={id:'daily',name:'Tâche journalière'};S.lists.push(dl)}dl.daily=true}
function resetDaily(){const td=today(),ids=new Set(S.lists.filter(l=>l.daily).map(l=>l.id));let ch=false;S.tasks.forEach(t=>{if(t.done&&ids.has(t.list)){if(!t.doneAt){t.doneAt=td;ch=true}else if(t.doneAt<td){t.done=false;t.doneAt='';ch=true}}});return ch}
resetDaily();
S.ext=S.ext||{};{const k=inDays(-7);for(const x in S.ext)if(x.slice(0,10)<k)delete S.ext[x]}
const ACC={indigo:['#3b5bdb','#8ea2ff'],vert:['#2f9e44','#69db7c'],rose:['#d6336c','#faa2c1'],orange:['#e8590c','#ffa94d'],cyan:['#0c8599','#66d9e8'],violet:['#7048e8','#b197fc']};
function lookVars(th,ac,dark){const d=th==='dark'||(th!=='light'&&dark),a=ACC[ac]||ACC.indigo;return{dark:d,acc:d?a[1]:a[0],onacc:d?'#0f1115':'#fff'}}
function applyLook(){const c=S.cfg,r=document.documentElement,mq=!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),v=lookVars(c.theme,c.acc,mq);
  if(c.theme==='light'||c.theme==='dark')r.setAttribute('data-theme',c.theme);else r.removeAttribute('data-theme');
  r.setAttribute('data-fs',c.fs||'m');r.style.setProperty('--acc',v.acc);r.style.setProperty('--onacc',v.onacc);
  document.body.classList.toggle('gripR',c.gripR==='1');document.body.classList.toggle('fabL',c.fabL==='1')}
applyLook();try{window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook)}catch(_){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
snapNow();
const fmt=d=>d===today()?'Aujourd’hui':d===inDays(1)?'Demain':new Date(d+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const get=id=>S.tasks.find(t=>t.id===id);
const curList=()=>S.lists.find(l=>l.id===S.cur);
const REP={'':'Ne se répète pas',d:'Tous les jours',w:'Toutes les semaines',m:'Tous les mois',y:'Tous les ans'};
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GRIP='<svg viewBox="0 0 10 16" width="10" height="16"><g fill="currentColor"><circle cx="2" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="2" cy="13" r="1.5"/><circle cx="8" cy="13" r="1.5"/></g></svg>';

function nextDate(date,r,rd){const d=new Date((date||today())+'T00:00'),od=rd||d.getDate();
  if(r==='d')d.setDate(d.getDate()+1);if(r==='w')d.setDate(d.getDate()+7);
  if(r==='m'||r==='y'){d.setDate(1);d.setMonth(d.getMonth()+(r==='m'?1:12));d.setDate(Math.min(od,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  return iso(d)}
function sorted(arr){const a=[...arr];
  if(S.sort==='date')a.sort((x,y)=>(x.date||'9')<(y.date||'9')?-1:(x.date||'9')>(y.date||'9')?1:0);
  if(S.sort==='title')a.sort((x,y)=>x.title.localeCompare(y.title,'fr'));
  return a}
function reorder(ids){ids=[...new Set(ids)].filter(Boolean);const set=new Set(ids),pos=[],m={};
  S.tasks.forEach((t,i)=>{if(set.has(t.id)){pos.push(i);m[t.id]=t}});
  if(pos.length!==ids.length||ids.some(id=>!m[id]))return;
  pos.forEach((p,k)=>S.tasks[p]=m[ids[k]])}

function row(t,sub,showList,grip){
  const l=showList?S.lists.find(x=>x.id===t.list):null;
  const chips=(t.date?`<span class="chip ${t.date<today()&&!t.done?'late':''}">${fmt(t.date)}${t.repeat?' ↻':''}</span>`:'')+(t.dur?`<span class="chip">${t.dur} min</span>`:'')+(t.place?`<span class="chip">${esc(((S.places||[]).find(o=>o.id===t.place)||{}).n||'')}</span>`:'')+(l?`<span class="chip">${esc(l.name)}</span>`:'');
  return `<div class="task ${sub?'sub':''} ${grip||sub?'':'ng'} ${t.done?'done':''}" data-id="${t.id}">
  ${grip?`<div class="grip" aria-hidden="true">${GRIP}</div>`:''}
  <button class="chk" data-act="toggle" aria-label="${t.done?'Marquer comme à faire':'Marquer comme terminée'}"><span class="c">${CHK}</span></button>
  <div class="body" data-act="open" tabindex="0"><div><span class="ttl">${esc(t.title)}</span></div>${t.notes?`<div class="nt">${esc(t.notes)}</div>`:''}${chips?`<div class="meta">${chips}</div>`:''}</div>
  <button class="star ${t.starred?'on':''}" data-act="star" aria-label="Favori">${t.starred?'★':'☆'}</button></div>`}
const block=(t,showList,grip)=>row(t,false,showList,grip)+S.tasks.filter(s=>s.parent===t.id).map(s=>row(s,true)).join('');

function renderHead(){
  const fav=S.cur==='starred',tmw=S.cur==='tomorrow',l=curList();
  const n=S.tasks.filter(t=>!t.parent&&!t.done&&inView(t)).length;
  $('#sub').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('#title').textContent=ui.q?'Recherche':fav?'Favoris':tmw?'Pour demain':l.name;$('#sbar').hidden=!ui.sq;
  $('#cnt').textContent=n?`${n} à faire`:'Rien à faire';
  $('#more').style.display=(fav||tmw||ui.q)?'none':'';
  $('#tabs').innerHTML=`<button class="tab ${fav?'on':''}" data-act="nav" data-id="starred">★ Favoris</button>`+`<button class="tab ${tmw?'on':''}" data-act="nav" data-id="tomorrow">Pour demain</button>`+
   S.lists.map(x=>`<button class="tab ${S.cur===x.id?'on':''}" data-act="nav" data-id="${x.id}">${esc(x.name)}</button>`).join('')+
   `<button class="tab ghost" data-act="newlist">+ Liste</button>`}
function revealTab(){const o=$('#tabs .on');o&&o.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}

function renderMain(){
  const fav=S.cur==='starred',virt=fav||S.cur==='tomorrow'||!!ui.q;
  const all=S.tasks.filter(t=>!t.parent&&inView(t));
  const todo=sorted(all.filter(t=>!t.done)),done=all.filter(t=>t.done);
  const drag=!virt&&S.sort==='order'&&todo.length>1;
  const blk=(t,c,g)=>`<div class="blk ${c} ${ui.fx===t.id?'in':''}" data-id="${t.id}">${block(t,virt,g)}</div>`;
  $('#main').innerHTML=(S.sort!=='order'&&!virt?`<div class="mu" style="margin:0 4px 12px">Tri par ${S.sort==='date'?'date':'titre'} · le planning suit « Mon ordre ». <button class="chip" data-act="sort" data-k="order">Revenir à Mon ordre</button></div>`:'')+(curList()&&curList().daily?'<div class="mu" style="margin:0 4px 12px">↻ Ces tâches se remettent à faire chaque matin.</div>':'')+(todo.length?`<div id="list">${todo.map(t=>blk(t,'todo',drag)).join('')}</div>`
   :`<div class="empty"><b>${done.length?'Tout est fait':'Aucune tâche'}</b>${done.length?'Profite de ta journée.':'Touche + pour en ajouter une.'}</div>`)+
   (done.length?`<button class="done-h" data-act="showdone"><span>${S.showDone?'▾':'▸'}</span>Terminées (${done.length})</button>${S.showDone?done.map(t=>blk(t,'dn',false)).join(''):''}`:'');
  ui.fx=null}

function renderSheet(){const p=$('#panel'),k=(ui.sheet||'')+'|'+(ui.sheet==='wiz'?ui.wiz:'')+'|'+(ui.open||'')+'|'+(ui.det?ui.det.d+':'+ui.det.s:''),keep=p.dataset.k===k?p.scrollTop:0;
  renderSheet0();p.dataset.k=ui.sheet?k:'';p.scrollTop=ui.sheet?keep:0}
function renderSheet0(){
  const p=$('#panel'),s=ui.sheet;
  $('#bd').classList.toggle('show',!!s);p.classList.toggle('show',!!s);$('#fab').classList.toggle('hide',!!s);
  if(!s)return;
  if(s==='add'){
    p.innerHTML=`<div class="bar"></div><input class="big" id="nt" placeholder="Nouvelle tâche" autocomplete="off" enterkeyhint="done">
    <textarea id="nn" placeholder="Informations" style="margin-top:8px"></textarea>
    <label for="nd">Date</label><div class="row2"><input type="date" id="nd" value="${ui.defDate||''}"><button class="pill" data-act="dt" data-v="0">Auj.</button><button class="pill" data-act="dt" data-v="1">Demain</button></div>
    <label for="nu">Durée estimée en minutes (facultatif)</label><input id="nu" type="number" inputmode="numeric" min="5" max="480" step="5" placeholder="Auto">
    <label for="np">Disponibilité (facultatif)</label><select id="np"><option value="">Toujours</option>${(S.places||[]).map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select>
    <div class="row2" style="margin-top:20px"><button class="pill main" data-act="add">Enregistrer</button></div>`;
    setTimeout(()=>{const i=$('#nt');i&&i.focus()},150)}
  else if(s==='menu'){
    const so=(k,t)=>`<button class="mi" data-act="sort" data-k="${k}"><span>${S.sort===k?'✓':''}</span>${t}</button>`;
    p.innerHTML=`<div class="bar"></div><label style="margin-top:0">Trier par</label>${so('order','Mon ordre (glisser pour réorganiser)')}${so('date','Date')}${so('title','Titre')}
    <button class="mi" data-act="rename"><span>✎</span>Renommer la liste</button>
    <button class="mi" data-act="clear"><span>✓</span>Supprimer les tâches terminées</button>
    <button class="mi del" data-act="dellist" ${S.lists.length<2?'disabled style="opacity:.4"':''}><span style="color:inherit">🗑</span>Supprimer la liste</button>`}
  else if(s==='look'){const c=S.cfg,seg=(k,o)=>`<div class="seg" style="margin:6px 0">${o.map(([v,t])=>`<button class="${(c[k]||o[0][0])===v?'on':''}" data-act="setc" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div>`;
    p.innerHTML=`<div class="sh"><div class="bar"></div><button class="x" data-act="close" aria-label="Fermer">✕</button></div><div class="k2">Personnaliser</div><h3 style="margin:2px 0 0;font-size:20px;padding-right:40px">Apparence et confort</h3>
    <div class="sec"><b>Thème</b></div>${seg('theme',[['auto','Auto'],['light','Clair'],['dark','Sombre']])}
    <div class="sec"><b>Couleur</b></div><div class="swc">${Object.entries(ACC).map(([k,v])=>`<button class="${(c.acc||'indigo')===k?'on':''}" style="background:${v[0]}" data-act="setc" data-k="acc" data-v="${k}" aria-label="${k}"></button>`).join('')}</div>
    <div class="sec"><b>Taille du texte</b></div>${seg('fs',[['s','Petit'],['m','Normal'],['l','Grand']])}
    <div class="sec"><b>Main d’usage</b></div><div class="seg" style="margin:6px 0"><button data-act="hand" data-v="L">Gaucher</button><button data-act="hand" data-v="R">Droitier</button></div>
    <div class="sec"><b>Bouton +</b></div>${seg('fabL',[['0','À droite'],['1','À gauche']])}
    <div class="sec"><b>Poignée ⠿ de déplacement</b></div>${seg('gripR',[['0','À gauche'],['1','À droite']])}
    <div class="foot"><button class="pill main" data-act="close">Terminé</button></div>`}
  else if(s==='bak'){let b={};try{b=JSON.parse(localStorage.getItem('gtasks_bak'))||{}}catch(_){}const ks=Object.keys(b).sort().reverse();
    p.innerHTML=`<div class="sh"><div class="bar"></div><button class="x" data-act="close" aria-label="Fermer">✕</button></div><div class="k2">Ne rien perdre</div><h3 style="margin:2px 0 0;font-size:20px;padding-right:40px">Sauvegardes</h3><div class="mu">Dernière sauvegarde partagée : ${S.lastBackup?fmt(S.lastBackup):'jamais'}</div>
    <div class="card2 pal" style="margin-top:14px"><button data-act="export">Partager ou télécharger une sauvegarde<span>⤓</span></button><button data-act="import">Importer une sauvegarde<span>⤒</span></button></div>
    <div class="sec"><b>Copies automatiques (sur ce téléphone)</b></div><div class="card2 pal">${ks.length?ks.map(k=>`<button data-act="restore" data-k="${k}">${fmt(k)}<span>Restaurer</span></button>`).join(''):'<div class="mu" style="padding:14px 0">Aucune pour l’instant.</div>'}</div>
    <div class="mu" style="margin:10px 4px">Une copie est faite chaque jour. Elle protège d’une fausse manipulation, mais pas si tu vides les données du navigateur : partage une sauvegarde de temps en temps.</div><div class="foot"><button class="pill main" data-act="close">Fermer</button></div>`}
  else if(s==='rem'){const c=S.cfg,sel=(k,d)=>`<select data-c="${k}"><option value="1" ${(c[k]??d)==='1'?'selected':''}>Oui</option><option value="0" ${(c[k]??d)==='0'?'selected':''}>Non</option></select>`;
    p.innerHTML=`<div class="sh"><div class="bar"></div><button class="x" data-act="close" aria-label="Fermer">✕</button></div><div class="k2">Ne rien oublier</div><h3 style="margin:2px 0 0;font-size:20px;padding-right:40px">Rappels et agenda</h3>
    <div class="sec"><b>Agenda du téléphone (le plus fiable)</b></div><div class="mu">Exporte les 7 prochains jours : ton calendrier te prévient même quand l’app est fermée. À refaire une fois par semaine.</div>
    <label>Réveil</label>${sel('icsWake','1')}<label>Bus (alarme avant le départ)</label>${sel('icsBus','1')}<label>Blocs de travail</label>${sel('icsWork','0')}
    <button class="addb" data-act="ics">Exporter vers l’agenda (7 jours)</button>
    <div class="sec"><b>Notifications dans l’app</b></div><div class="mu">Un rappel 10 min avant de partir pour le bus. Ça ne marche que si l’app est ouverte ou active en arrière-plan.</div>
    <button class="addb" data-act="notif">${c.notifOn==='1'?'Notifications activées ✓':'Activer les notifications'}</button>
    <div class="foot"><button class="pill main" data-act="close">Terminé</button></div>`}
  else if(s==='mv'){const t=get(ui.mvId);if(!t){ui.sheet=null;return renderSheet()}

async function loadEdt(){
  const pw=localStorage.getItem('edtpass');if(!pw){renderEdt();return}
  try{
    const r=await fetch('data/edt.enc.json?t='+Date.now());if(!r.ok)throw new Error('fichier');
    const j=await r.json(),enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('mon-cap-edt-v1'),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(j.iv)},k,b64u(j.data));
    const dj=JSON.parse(new TextDecoder().decode(p));E.lessons=dj.lessons;E.err='';importHw(dj.homework||[]);checkChanges();
    try{localStorage.setItem('edtcache',JSON.stringify(E.lessons))}catch(e){}
  }catch(e){E.err=e.message==='fichier'?'Synchro introuvable.':e.name==='TypeError'?(E.lessons?'Hors ligne : dernière synchro affichée.':'Hors ligne.'):'Mot de passe de chiffrement incorrect ou synchro indisponible.'}
  renderEdt()}

  const ok=(x,home,lines)=>x.w.includes(w)&&(lines==='both'||x.l===lines)&&(x.l!=='E91'||sc)&&x.t[home]&&x.t[sch];

  <div class="cs">${di.hol?`<span class="chip">${esc(di.hol)}</span>`:''}<span class="chip">${co.length?co.length+' cours · '+hhmm(co[0].s)+'–'+hhmm(co[co.length-1].e):'Pas de cours'}</span><span class="chip">${Math.round(work/6)/10} h de travail</span>${busPlan(tm).infos.map(x=>`<span class="chip">🚌 ${esc(x.title)}</span>`).join('')}</div>
  ${df.length?`<div class="nt2">À venir : ${df.map(x=>'contrôle de '+esc(x.subject)+' le '+fmt(x.d)).join(', ')}</div>`:''}
  <div class="sec"><b>Tes tâches</b><span class="mu">${all.length}</span></div>
  <div class="card2">${tt.map(row).join('')||'<div class="mu" style="padding:14px 0">Rien en attente</div>'}</div>${all.length>6?`<div class="mu" style="margin-top:6px">+ ${all.length-6} autres dans l’onglet Tâches</div>`:''}

function examHTML(){const td=today(),L=S.exams.filter(x=>x.d>=td).sort((a,b)=>a.d<b.d?-1:1),subs=[...new Set((E.lessons||[]).map(l=>l.subject).filter(Boolean))];

  ${L.map(x=>`<div class="rrow row2" style="justify-content:space-between;margin-top:10px"><div><b>${esc(x.subject)}</b> · ${fmt(x.d)}${x.n?`<div class="mu">${esc(x.n)}</div>`:''}</div><button class="icon" data-act="exdel" data-id="${x.id}" aria-label="Supprimer">✕</button></div>`).join('')}
  <label>Nouveau contrôle</label><input id="xs" list="sl" placeholder="Matière"><datalist id="sl">${subs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <input type="date" id="xd" value="${addDay(td,7)}" style="margin-top:8px"><input id="xn" placeholder="Chapitre, note (facultatif)" style="margin-top:8px">

const mon=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const fh=m=>Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0');
const wkd=(d,o)=>new Date(d+'T00:00').toLocaleDateString('fr-FR',o);
function weekStats(){const td=today(),days=[...Array(7)].map((_,i)=>addDay(td,i-6));
  const D=days.map(d=>{const L=S.log.filter(x=>x.d===d);return{d,real:L.reduce((a,x)=>a+(x.real??x.mins??0),0),p:Math.max((S.day[d]||{}).p||0,L.reduce((a,x)=>a+(x.mins||0),0))}});
  const L=S.log.filter(x=>x.d>=days[0]),tp=D.reduce((a,x)=>a+x.p,0),tr=D.reduce((a,x)=>a+x.real,0);
  const ea=avg(L.filter(x=>x.mins&&x.real!==undefined).map(x=>x.mins-x.real));
  return{D,L,tp,tr,pct:tp?Math.round(tr/tp*100):0,early:ea}}
function chart2HTML(){const w=weekStats();if(!w.tp&&!w.tr)return`<div class="mu">Ton temps prévu et réellement travaillé apparaîtra ici.</div>`;
  const mx=Math.max(60,...w.D.map(x=>Math.max(x.p,x.real)));
  const bars=w.D.map((x,i)=>{const a=x.p/mx*80,b=x.real/mx*80,xx=10+i*44;return`<rect x="${xx}" y="${100-a}" width="15" height="${Math.max(a,2)}" rx="4" fill="var(--soft)" stroke="var(--line)"/><rect x="${xx+17}" y="${100-b}" width="15" height="${Math.max(b,2)}" rx="4" fill="var(--acc)"/><text x="${xx+16}" y="116" text-anchor="middle" font-size="11" fill="var(--mut)">${wkd(x.d,{weekday:'narrow'}).toUpperCase()}</text>`}).join('');
  return`<svg viewBox="0 0 320 122" width="100%" role="img" aria-label="Temps prévu et réel sur 7 jours">${bars}</svg><div class="mu">Gris : prévu · Bleu : fait. ${fh(w.tr)} sur ${fh(w.tp)} prévues (${w.pct} %).</div>${w.early&&w.early>=3?`<div class="nx">Tu finis en moyenne ${Math.round(w.early)} min plus tôt que prévu : tu peux raccourcir tes sessions dans le questionnaire.</div>`:''}`}
function bilanHTML(){const td=today(),w=weekStats(),L=w.L,rs=L.filter(x=>x.r).map(x=>x.r),by={};
  L.forEach(x=>{const k=subjShort(x.subject||x.title);(by[k]=by[k]||{m:0,r:[]});by[k].m+=x.real??x.mins??0;if(x.r)by[k].r.push(x.r)});
  const top=Object.entries(by).sort((a,b)=>b[1].m-a[1].m).slice(0,3),weak=Object.entries(by).filter(e=>e[1].r.length).map(e=>[e[0],avg(e[1].r)]).sort((a,b)=>a[1]-b[1])[0];
  const best=[...w.D].sort((a,b)=>b.real-a.real)[0],neg=subjectsList(td).map(x=>[x,subjGap(x,td)]).filter(x=>x[1]>=7).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const nxt=[...Array(7)].map((_,i)=>{const d=addDay(td,i+1),pl=plan(d),di=dayInfo(d),co=pl.filter(b=>b.t==='cours').length,wk=pl.filter(b=>b.t==='task'||b.t==='revision').reduce((a,b)=>a+b.e-b.s,0);
    return`<div class="wk ${di.off||!co?'off':''}"><div class="wd"><b>${wkd(d,{weekday:'short'}).replace('.','')}</b><span>${new Date(d+'T00:00').getDate()}</span></div><div class="wm"><div class="wt">${di.hol?esc(di.hol):co?co+' cours':'Pas de cours'}</div><div class="wb"><i style="width:${Math.min(100,Math.round(wk/540*100))}%"></i></div></div><div class="wh">${fh(wk)}</div></div>`}).join('');
  const ex=S.exams.filter(x=>x.d>td&&x.d<=addDay(td,7)),hw=S.tasks.filter(t=>t.hw&&!t.done&&t.date>td&&t.date<=addDay(td,7)).length;
  return`<div class="sh"><div class="bar"></div><button class="x" data-act="close" aria-label="Fermer">✕</button></div>
  <div class="k2">Bilan de la semaine</div><h3 style="margin:2px 0 0;font-size:22px">Tes 7 derniers jours</h3>
  <div class="tiles"><div class="tile"><b>${L.length}</b><span>session${L.length>1?'s':''}</span></div><div class="tile"><b>${fh(w.tr)}</b><span>travaillé</span></div><div class="tile"><b>${w.tp?w.pct+' %':'—'}</b><span>du prévu</span></div></div>
  ${rs.length?`<div class="mu" style="text-align:center;margin-top:8px">Humeur moyenne ${avg(rs).toFixed(1)}/5</div>`:''}
  ${best&&best.real?`<div class="card2" style="margin-top:14px"><div class="ins"><i>🏆</i><span>Meilleur jour : <b>${wkd(best.d,{weekday:'long'})}</b> (${fh(best.real)})</span></div>${top.length?`<div class="ins"><i>📚</i><span>Le plus travaillé : <b>${top.map(t=>esc(t[0])).join(', ')}</b></span></div>`:''}${weak?`<div class="ins"><i>🎯</i><span>À renforcer : <b>${esc(weak[0])}</b> (${weak[1].toFixed(1)}/5)</span></div>`:''}</div>`:''}
  ${neg.length?`<div class="card2" style="margin-top:10px"><div class="ins" style="border-top:0"><i>⚠️</i><span>Matières négligées : <b>${neg.map(x=>esc(x[0])+' ('+(x[1]>=999?'jamais':x[1]+' j')+')').join(', ')}</b></span></div></div>`:''}

const hstreak=id=>{let n=0,d=today();if(!(S.hlog[d]||[]).includes(id))d=addDay(d,-1);while((S.hlog[d]||[]).includes(id)){n++;d=addDay(d,-1)}return n};
const hweek=id=>{let n=0;const m=mon(today());for(let i=0;i<7;i++)if((S.hlog[addDay(m,i)]||[]).includes(id))n++;return n};

function habHTML(){return`<div class="bar"></div><h3 style="margin:0 0 4px;font-size:18px">Habitudes</h3><div class="mu">Coche-les chaque jour sur Principal. L’objectif est le nombre de jours par semaine.</div>

function dayCard(d,td){const di=dayInfo(d),chips=[di.hol,...di.sp.map(x=>KS[x.k])].filter(Boolean).map(esc).join(' · ');let rows;
  if(d<td)rows=S.log.filter(x=>x.d===d).map(x=>`<div class="tl"><div class="h">${x.real??x.mins??''}${(x.real??x.mins)?' min':''}</div><div class="bx" style="cursor:default"><div class="s">${esc(x.title)}</div><div class="r">${x.r?'Note '+x.r+'/5':'Fait'}</div></div></div>`);
  else rows=plan(d).filter(b=>b.t!=='pause'&&b.t!=='info'&&b.t!=='routine').map(b=>`<div class="tl"><div class="h">${hhmm(b.s)}</div><div class="bx" data-act="det" data-d="${d}" data-s="${b.s}"><div class="s ${b.done?'dn':''}">${dot(b)}${esc(b.title)}</div><div class="r">${TYPE[b.t]} · ${b.e-b.s} min</div></div></div>`);
  return`<div class="hc ${d===td?'today':''}"><div class="ht"><h3 style="text-transform:capitalize">${wkd(d,{weekday:'long',day:'numeric'})}</h3><span class="mu" style="margin-left:auto;text-align:right">${chips}</span></div>${rows.join('')||'<div class="mu">Rien de prévu.</div>'}</div>`}
function renderAgenda(){if(ui.tab!=='agenda')return;const td=today(),ag=ui.ag;let title,body;
  if(ag.mode==='week'){const m=addDay(mon(td),ag.off*7);title='Semaine du '+wkd(m,{day:'numeric',month:'long'});body=[...Array(7)].map((_,i)=>dayCard(addDay(m,i),td)).join('')}
  else{const f=new Date(td+'T00:00');f.setDate(1);f.setMonth(f.getMonth()+ag.off);const y=f.getFullYear(),mo=f.getMonth(),dim=new Date(y,mo+1,0).getDate(),pad=(f.getDay()+6)%7;
    title=f.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
