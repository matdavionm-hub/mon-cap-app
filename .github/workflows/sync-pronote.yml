name: Sync Pronote
on:
  schedule:
    - cron: "*/15 5-21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pronotepy cryptography
      - run: python sync_pronote.py
        env:
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USER: ${{ secrets.PRONOTE_USER }}
          PRONOTE_PASS: ${{ secrets.PRONOTE_PASS }}
          EDT_PASSPHRASE: ${{ secrets.EDT_PASSPHRASE }}
      - name: Enregistrer si changement
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/edt.enc.json
          git diff --cached --quiet || (git commit -m "Maj emploi du temps" && git push)
